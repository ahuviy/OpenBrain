name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs deploy whatever master currently points at — useful for
  # re-deploying without an empty commit, e.g. after changing a Fly secret.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  integration-db:
    name: Database integration tests
    runs-on: ubuntu-latest

    # A service container, not a compose file: GitHub manages its lifecycle and
    # health, so the job cannot start against a Postgres that is still booting.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: openbrain
          POSTGRES_USER: openbrain
          POSTGRES_PASSWORD: testonly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbrain -d openbrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: openbrain
      DB_USER: openbrain
      DB_PASSWORD: testonly
      EMBEDDING_DIMENSIONS: 768

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist/ is needed to boot the app below; build-and-test runs in a separate
      # job with its own filesystem.
      - name: Build
        run: npm run build

      - name: Prepare database
        run: node scripts/prepare-database.js

      - name: Integration tests
        run: node scripts/run-integration-tests.js

  # Deploys the committed tree, which is the point: `fly deploy` from a laptop
  # ships the working directory, so uncommitted or half-written files reach
  # production. Here the only input is the commit that passed the gate above.
  #
  # master only, and never on a pull_request: a PR build from a fork of this
  # public repository must not see FLY_API_TOKEN. Manual dispatch is allowed
  # because only someone with write access can trigger it.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-db]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    # Never let two deploys race for the same machine. Not cancel-in-progress:
    # killing flyctl mid-rollout leaves the release half-applied.
    concurrency:
      group: deploy-fly-openbrain-ahuvi
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy . --config deploy/hosted/fly/fly.toml --app openbrain-ahuvi --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: |
          for attempt in $(seq 1 10); do
            body=$(curl -fsS --max-time 30 "https://openbrain-ahuvi.fly.dev/health?deep=1" || true)
            echo "attempt ${attempt}: ${body:-<no response>}"
            case "$body" in
              *'"status":"healthy"'*) echo "Deployment is healthy."; exit 0 ;;
            esac
            sleep 10
          done
          echo "Health check never reported healthy after deploy." >&2
          exit 1

  # One notification per run, whatever happened. `always()` so a failed gate
  # still reports — a pipeline that only tells you about successes is a
  # pipeline you stop trusting.
  #
  # Commit subject and author are read with git rather than interpolated from
  # the github context: this repository is public, and `${{ }}` expansion of
  # attacker-controlled text into a shell script is a script-injection hole.
  notify:
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-db, deploy]
    if: always() && github.event_name != 'pull_request'

    env:
      NTFY_URL: ${{ secrets.NTFY_URL }}
      BUILD_RESULT: ${{ needs.build-and-test.result }}
      INTEGRATION_RESULT: ${{ needs['integration-db'].result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Send ntfy notification
        if: env.NTFY_URL != ''
        run: |
          set -euo pipefail

          subject=$(git log -1 --pretty=%s)
          author=$(git log -1 --pretty=%an)
          short_sha=$(git rev-parse --short HEAD)

          # A job that did not run is not a failure; anything else is. Checking
          # every job matters — a green notification that hid a failed test run
          # would be worse than no notification.
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }

          if [ "$BUILD_RESULT" = "success" ] && ok "$INTEGRATION_RESULT" && ok "$DEPLOY_RESULT"; then
            title="Open Brain CI passed"
            priority="default"
            tags="white_check_mark"
            headline="Deployed and healthy."
            [ "$DEPLOY_RESULT" = "skipped" ] && headline="Build and tests passed (no deploy for this run)."
          else
            title="Open Brain CI FAILED"
            priority="urgent"
            tags="rotating_light"
            failed=""
            [ "$BUILD_RESULT" != "success" ] && failed="build-and-test"
            [ "$DEPLOY_RESULT" != "success" ] && [ "$DEPLOY_RESULT" != "skipped" ] && failed="${failed:+$failed, }deploy"
            [ "$INTEGRATION_RESULT" != "success" ] && [ "$INTEGRATION_RESULT" != "skipped" ] && failed="${failed:+$failed, }integration-db"
            headline="Failed: ${failed:-unknown}."
          fi

          # Header values must be ASCII — HTTP headers are Latin-1 and a commit
          # subject with an em dash or Hebrew would be rejected. Details that may
          # carry non-ASCII go in the UTF-8 body instead.
          body=$(printf '%s\n\n%s\n%s by %s\nbranch %s\n\nbuild: %s | integration: %s | deploy: %s\n\n%s' \
            "$headline" \
            "$short_sha" "$subject" "$author" \
            "${GITHUB_REF_NAME}" \
            "$BUILD_RESULT" "$INTEGRATION_RESULT" "$DEPLOY_RESULT" \
            "$RUN_URL")

          curl -fsS --max-time 20 \
            -H "Title: ${title}" \
            -H "Priority: ${priority}" \
            -H "Tags: ${tags}" \
            -H "Actions: view, Open run, ${RUN_URL}; view, Open app, https://openbrain-ahuvi.fly.dev/health?deep=1" \
            -d "$body" \
            "$NTFY_URL" > /dev/null

          echo "Notified: ${title} (${short_sha})"
