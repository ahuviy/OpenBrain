name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs deploy whatever master currently points at — useful for
  # re-deploying without an empty commit, e.g. after changing a Fly secret.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # Deploys the committed tree, which is the point: `fly deploy` from a laptop
  # ships the working directory, so uncommitted or half-written files reach
  # production. Here the only input is the commit that passed the gate above.
  #
  # master only, and never on a pull_request: a PR build from a fork of this
  # public repository must not see FLY_API_TOKEN. Manual dispatch is allowed
  # because only someone with write access can trigger it.
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    # Never let two deploys race for the same machine. Not cancel-in-progress:
    # killing flyctl mid-rollout leaves the release half-applied.
    concurrency:
      group: deploy-fly-openbrain-ahuvi
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy . --config deploy/hosted/fly/fly.toml --app openbrain-ahuvi --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: |
          for attempt in $(seq 1 10); do
            body=$(curl -fsS --max-time 30 "https://openbrain-ahuvi.fly.dev/health?deep=1" || true)
            echo "attempt ${attempt}: ${body:-<no response>}"
            case "$body" in
              *'"status":"healthy"'*) echo "Deployment is healthy."; exit 0 ;;
            esac
            sleep 10
          done
          echo "Health check never reported healthy after deploy." >&2
          exit 1
